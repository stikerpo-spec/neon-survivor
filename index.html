<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Survivor 4.0</title>
<style>body{margin:0;background:#060914;color:#eef;font:16px Arial}main{max-width:850px;margin:50px auto;padding:25px}.card{padding:20px;margin:15px 0;border:1px solid #30466f;border-radius:16px;background:#091127}input,button{padding:11px;margin:5px;border-radius:10px}input{width:260px}button{background:#111c35;color:#fff;border:1px solid #456;cursor:pointer}.primary{background:#087e9f}.gem{color:#cf92ff}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main>
<h1>NEON SURVIVOR 4.0</h1>
<div id="auth" class="card"><h2>Login</h2><input id="email" type="email" placeholder="E-Mail"><input id="password" type="password" placeholder="Passwort"><br><button class="primary" onclick="signup()">Registrieren</button><button onclick="login()">Einloggen</button><p id="msg"></p></div>
<div id="app" class="card" style="display:none"><h2>Account</h2><pre id="profile"></pre><button onclick="buy('gems_100')">💎 100 Gems</button><button onclick="buy('gems_550')">💎 550 Gems</button><button onclick="buy('premium')">⭐ Premium</button><button onclick="logout()">Ausloggen</button><p id="shopmsg"></p></div>
<script>
const SUPABASE_URL='YOUR_SUPABASE_URL',SUPABASE_PUBLISHABLE_KEY='YOUR_SUPABASE_PUBLISHABLE_KEY',API='http://localhost:3000';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
async function refresh(){const {data:{session}}=await sb.auth.getSession();if(!session)return;$('auth').style.display='none';$('app').style.display='block';const r=await fetch(API+'/api/profile',{headers:{Authorization:'Bearer '+session.access_token}});$('profile').textContent=JSON.stringify(await r.json(),null,2)}
async function signup(){const {error}=await sb.auth.signUp({email:$('email').value,password:$('password').value});$('msg').textContent=error?.message||'Registrierung gestartet. Prüfe ggf. deine E-Mail.'}
async function login(){const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('msg').textContent=error?.message||'';refresh()}
async function logout(){await sb.auth.signOut();location.reload()}
async function buy(productId){const {data:{session}}=await sb.auth.getSession();if(!session)return alert('Bitte einloggen');const r=await fetch(API+'/api/create-checkout-session',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({productId})});const d=await r.json();if(d.url)location.href=d.url;else $('shopmsg').textContent=d.error}
sb.auth.onAuthStateChange(()=>refresh());refresh();
</script></main></body></html>
